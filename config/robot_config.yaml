# BushXI_Clean_Robot Configuration

robot:
  name: "BushXI"
  type: "Humanoid"
  total_joints: 19
  control_frequency_hz: 50

ai_models:
  whisper_size: "base"
  whisper_device: "cpu"      # Đổi thành 'cuda' nếu dùng GPU
  yolo_version: "yolov8n.pt"
  llava_server_url: "http://localhost:11434/api/generate"

camera:
  resolution_width: 640
  resolution_height: 480
  fps: 30
  frame_topic: "/World/Robot_Camera"
